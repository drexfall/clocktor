    <meta name="viewport" content="height=device-height, initial-scale=1.0"/>
    <meta name="title" content="view by drexfall"/>
    <meta name="description"
          content="A clock made out of clocks, that's it"/>
    <meta name="keywords" content="images, views, view, image, gallery, album, drexfall, drex"/>
    <meta name="robots" content="index, follow"/>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta name="language" content="English"/>

    <link rel="apple-touch-icon" sizes="180x180" href="https://source.drexfall.com/apple-touch-icon.png"/>
    <link rel="icon" type="image/png" sizes="32x32" href="https://source.drexfall.com/favicon-32x32.png"/>

    <title>clock-clock | drexfall</title>

    <link rel="stylesheet" href="https://source.drexfall.com/css/style.css"/>

    <link rel="stylesheet" href="css/style.css"/>
    <link rel="stylesheet" href="css/components.css"/>
</head>

<body>
<svg class="clock-bg-filter">
    <defs id="defs9024">
        <linearGradient xlink:href="#linearGradient8364" id="linearGradient8366" x1="0%"
                        y1="0%" x2="100%" y2="100%" gradientUnits="userSpaceOnUse"/>
        <linearGradient id="linearGradient8364">
            <stop offset="0" id="stop8360"/>
            <stop offset="1" id="stop8362"/>
        </linearGradient>
        <filter style="color-interpolation-filters: sRGB" id="filter1762"
                x="-1.0655179" y="-1.0655179" width="3.1773797" height="3.1773495">
            <feFlood flood-opacity="0.9" result="flood" id="feFlood1752"/>
            <feComposite in="flood" in2="SourceGraphic" operator="in" result="composite1" id="feComposite1754"/>
            <feGaussianBlur in="composite1" stdDeviation="30" result="blur" id="feGaussianBlur1756"/>
            <feOffset dx="50" dy="50" result="offset" id="feOffset1758"/>
            <feComposite in="SourceGraphic" in2="offset" operator="over" result="fbSourceGraphic"
                         id="feComposite1760"/>
            <feFlood id="feFlood8992" flood-opacity="1" result="flood" in="fbSourceGraphic"/>
            <feComposite in2="fbSourceGraphic" id="feComposite8994" in="flood" operator="in" result="composite1"/>
            <feGaussianBlur id="feGaussianBlur8996" in="composite1" stdDeviation="43" result="blur"/>
            <feOffset id="feOffset8998" dx="-21" dy="-21" result="offset"/>
            <feComposite in2="offset" id="feComposite9000" in="fbSourceGraphic" operator="over"
                         result="composite2"/>
        </filter>
    </defs>
</svg>
<main class="main-content">
    <section class="display-page">
        <div class="display-wrapper"></div>
    </section>
    <section class="preferences-page">
        <div class="main-preferences">
            <div class="palette-wrapper">
                <div class="primary color-box">
                    <label for="primary_color_picker">primary</label>
                    <span class="hex-prefix">#</span>
                    <input type="text" id="primary_color_picker" name="color_picker" maxlength="6"
                           pattern="^([a-fA-F0-9]{6})$"/>
                </div>
                <div class="accent color-box">
                    <label for="accent_color_picker">accent</label>
                    <span class="hex-prefix">#</span>
                    <input type="text" id="accent_color_picker" name="color_picker" maxlength="6"
                           pattern="^([a-fA-F0-9]{6})$"/>
                </div>
                <div class="background color-box">
                    <label for="background_picker">background</label>
                    <span class="hex-prefix">#</span>
                    <input type="text" id="background_picker" name="color_picker" maxlength="6"
                           pattern="^([a-fA-F0-9]{6})$"/>
                </div>
            </div>
            <div class="display-toggle-wrapper">
            </div>
            <div class="misc-settings">
                <ul class="options-list">
                    <h3>Additional Settings</h3>
                    <li class="drex-checkbox">
                        <label for="twelve_hour_check" class="active">twelve hour mode
                            <input id="twelve_hour_check" type="checkbox"/>
                            <span></span>
                        </label>

                    </li>
                    <li class="drex-checkbox">
                        <label for="zero_pad_check">zero in front of single digits
                            <input id="zero_pad_check" type="checkbox"/>
                            <span></span>
                        </label>
                    </li>
                </ul>
                <div class="style-type-list-container" hidden>
                    <h3>Page Style</h3>
                    <ul class="style-type-list">
                        <li class="drex-radio">
                            <label for="neumorphism_radio">neumorphism
                                <input type="radio" name="style_radio" id="neumorphism_radio"/>
                                <span></span>
                            </label>
                        </li>
                        <li class="drex-radio">
                            <label for="flat_radio">flat
                                style
                                <input type="radio" name="style_radio" id="flat_radio"/>
                                <span></span>
                            </label>
                        </li>
                        <li class="drex-radio">
                            <label for="shadow_radio">only shadows
                                <input type="radio" name="style_radio" id="shadow_radio"/>
                                <span></span>
                            </label>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

    </section>
</main>
<div class="alert-label"></div>

<script src="https://source.drexfall.com/scripts/main.js"></script>
<script src="js/constants.js"></script>
<script src="js/main.js"></script>

<script src="js/preferences.js"></script>
</body>

</html>
